- name: Copy ENV file to VPS
  hosts: webservers
  become: true
  tasks:
    - name: Copy .env.staging file to VPS
      copy:
        src: ../.env.staging
        dest: /home/user1/akun-app-compose/staging/.env
        mode: '0644'
    - name: Copy .env.production file to VPS
      copy:
        src: ../.env.production
        dest: /home/user1/akun-app-compose/production/.env
        mode: '0644'